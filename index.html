<!DOCTYPE html>
<html>
<head>
  <title>Login Page</title>
  <style>
    body {
      background-color: #8E7DFF;
      font-family: Arial, sans-serif;
    }

    h2 {
      text-align: center;
      color: #333;
    }

    form {
      background-color: #7744FF;
      width: 350px;
      margin: 30px auto;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0px 0px 10px 10px #00FF1D;
      color: white;
    }

    label {
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 8px;
      margin: 6px 0 15px 0;
      border: 1px solid #ccc;
      border-radius: 5px;
      box-sizing: border-box;
    }

    input[type="radio"] {
      width: auto;
      margin-right: 5px;
    }

    a.button-link, input[type="reset"] {
      display: inline-block;
      text-align: center;
      background-color: #4CAF50;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      cursor: pointer;
      width: 45%;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s;
    }

    input[type="reset"] {
      background-color: rgba(65, 173, 205, 1);
      
    }

    a.button-link:hover {
      background-color: #3931B5;
    }

    input[type="reset"]:hover {
      background-color: #e53935;
    }

    .maindiv {
      text-align: center;
      color: #fff;
    }
  </style>
</head>

<body>
  <div class="maindiv">
    <h2>SIGN IN</h2>
  </div>

  <form>
    <label>Full Name:</label><br>
    <input type="text" name="fullname"><br>

    <label>Email:</label><br>
    <input type="email" name="email"><br>

    <label for="pw">Password:</label><br>
    <input type="password" name="password" id="pw"><br>

    <label>Gender:</label><br>
    <input type="radio" name="gender" value="male"> Male
    <input type="radio" name="gender" value="female"> Female
    <input type="radio" name="gender" value="other"> Other<br><br>

    <!-- 🔗 Anchor tag button (your future link goes in href="") -->
    <a href="file.html" class="button-link">Submit</a>
    <input type="reset" value="Reset">
  </form>
</body>
</html>
